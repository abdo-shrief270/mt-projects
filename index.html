    <script>
        function featuredCard(it, page, ctaKey) {
            return `<article class="card">
                <div class="card-media">
                    <img src="${it.image}" alt="${L(it, "title")}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400/f6f7f9/b9790c?text=MT-Projects'">
                </div>
                <div class="card-body">
                    <span class="tag tag-${it.cat}">${L(it, "tagLabel")}</span>
                    <h3 class="card-title">${L(it, "title")}</h3>
                    <p class="card-desc">${L(it, "short")}</p>
                    <div class="card-foot">
                        <div class="price">${it.price} <small>${t("cat.currency")}</small></div>
                        <a class="btn btn-outline btn-sm" href="${page}">${t(ctaKey)}</a>
                    </div>
                </div>
            </article>`;
        }
        function renderFeatured() {
            document.getElementById("featProjects").innerHTML = PROJECTS.slice(0, 3).map((p) => featuredCard(p, "projects.html", "cat.details")).join("");
            document.getElementById("featCourses").innerHTML = COURSES.slice(0, 3).map((c) => featuredCard(c, "courses.html", "cat.enroll")).join("");
        }
        renderFeatured();
        window.addEventListener("mt:lang", renderFeatured);
    </script>
