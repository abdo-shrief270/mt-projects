<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكورسات | MT-Company</title>
    <meta name="description" content="كورسات هندسية عملية في الأردوينو وإنترنت الأشياء وتصميم PCB والروبوتات والذكاء الاصطناعي — من الصفر إلى الاحتراف مع شهادة إتمام.">
    <link rel="icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body data-page="courses">
    <div id="site-header"></div>

    <section class="hero" style="padding: 3.5rem 0 1rem;">
        <div class="container" style="text-align:center;">
            <span class="kicker" data-i18n="crs.kicker"></span>
            <h1 data-i18n="crs.h1"></h1>
            <p class="lead" style="margin: 1.2rem auto 0;"><span data-i18n="crs.leadA"></span> <span id="cCount">—</span> <span data-i18n="crs.leadB"></span></p>
        </div>
    </section>

    <section class="block" style="padding-top: 2rem;">
        <div class="container">
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" data-i18n-ph="ph.searchCourses" oninput="Catalog.search(this.value)">
                </div>
                <div class="controls">
                    <div class="filters">
                        <button class="chip active" onclick="Catalog.filter('all', event)" data-i18n="filter.all"></button>
                        <button class="chip" onclick="Catalog.filter('beginner', event)" data-i18n="filter.beginner"></button>
                        <button class="chip" onclick="Catalog.filter('intermediate', event)" data-i18n="filter.intermediate"></button>
                        <button class="chip" onclick="Catalog.filter('advanced', event)" data-i18n="filter.advanced"></button>
                    </div>
                    <select class="select" onchange="Catalog.sort(this.value)">
                        <option value="default" data-i18n="sort.default"></option>
                        <option value="low-high" data-i18n="sort.lowhigh"></option>
                        <option value="high-low" data-i18n="sort.highlow"></option>
                    </select>
                </div>
            </div>

            <div class="cards-grid" id="grid"></div>
            <div class="load-more" id="loadMore"><button class="btn btn-outline" onclick="Catalog.more()"><span data-i18n="common.loadmore"></span> <i class="fa-solid fa-chevron-down"></i></button></div>
        </div>
    </section>

    <!-- FAQ -->
    <section class="block tight">
        <div class="container" style="max-width: 820px;">
            <div class="section-head center"><h2 data-i18n="faq.title"></h2></div>
            <div class="faq-item" onclick="toggleFaq(this)"><div class="faq-q"><span data-i18n="crs.faq1q"></span><i class="fa-solid fa-chevron-down"></i></div><div class="faq-a" data-i18n="crs.faq1a"></div></div>
            <div class="faq-item" onclick="toggleFaq(this)"><div class="faq-q"><span data-i18n="crs.faq2q"></span><i class="fa-solid fa-chevron-down"></i></div><div class="faq-a" data-i18n="crs.faq2a"></div></div>
            <div class="faq-item" onclick="toggleFaq(this)"><div class="faq-q"><span data-i18n="crs.faq3q"></span><i class="fa-solid fa-chevron-down"></i></div><div class="faq-a" data-i18n="crs.faq3a"></div></div>
            <div class="faq-item" onclick="toggleFaq(this)"><div class="faq-q"><span data-i18n="crs.faq4q"></span><i class="fa-solid fa-chevron-down"></i></div><div class="faq-a" data-i18n="crs.faq4a"></div></div>
        </div>
    </section>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-card">
            <button class="modal-close" onclick="Catalog.close()">&times;</button>
            <h2 id="mTitle" class="gold-text" style="margin-bottom:1rem;"></h2>
            <img id="mImg" src="" alt="" style="width:100%;height:220px;object-fit:cover;border-radius:12px;margin-bottom:1.2rem;">
            <p id="mDesc" style="margin-bottom:1.4rem;color:var(--muted);"></p>
            <div class="includes"><div class="t" data-i18n="inc.crsTitle"></div><ul>
                <li><i class="fa-solid fa-video"></i> <span data-i18n="inc.videos"></span></li>
                <li><i class="fa-solid fa-file-lines"></i> <span data-i18n="inc.files"></span></li>
                <li><i class="fa-solid fa-certificate"></i> <span data-i18n="inc.cert"></span></li></ul></div>
            <div class="card-foot" style="border:none;padding-top:1.2rem;">
                <div class="price" id="mPrice"></div>
                <a id="mBuy" href="#" target="_blank" rel="noopener" class="btn btn-whatsapp"></a>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/catalog.js"></script>
    <script src="assets/js/courses-data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
        Catalog.mount({ type: "course", items: COURSES, gridId: "grid", loadMoreId: "loadMore", countId: "cCount", perPage: 6, ribbonKey: "cat.ribbonCrs", ctaKey: "cat.enroll" });
    </script>
</body>
</html>
